name: reminders
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min; GitHub may delay runs a few minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder function
        env:
          FUNCTION_URL: ${{ secrets.FUNCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$FUNCTION_URL" -H "x-cron-secret: $CRON_SECRET"